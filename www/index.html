<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#9b9b9f;--ac:#5b5b60;--bd:#303033;--dg:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#9b9b9f;--ac:#5b5b60;--bd:#303033;--dg:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:920px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:22px;margin:0;flex:1;word-break:break-word}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
.fab{background:var(--ac);color:#fff;border:0;width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.cat{display:flex;align-items:center;gap:10px;cursor:pointer}
.cat b{flex:1;font-size:17px}.cat span{color:var(--mu);font-size:13px}
input[type=text]{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.row{display:flex;gap:8px;margin-bottom:12px}
.x{border:0;background:none;color:var(--mu);padding:4px 8px;font-size:18px}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
#edh{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
#pages{padding-bottom:200px}
.pw{margin-bottom:18px}
.ph2{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:12px;max-width:900px;margin:0 auto 2px}
.pg{position:relative;width:100%;max-width:900px;margin:0 auto;background:#fff;container-type:inline-size;box-shadow:0 0 0 1px #3a3a3c;border-radius:6px;overflow:hidden}
.pg img,.pg canvas,.tx{position:absolute;inset:0;width:100%;height:100%}
.pv{touch-action:none;opacity:.35;cursor:crosshair}
body.hand .pv{touch-action:pan-y pinch-zoom}
.tx{pointer-events:none}
.tx div{pointer-events:auto;position:absolute;font-size:2.6cqw;line-height:1.3;white-space:pre-wrap;min-width:6cqw;padding:0 .5cqw;outline:none;font-family:system-ui,sans-serif}
.tx div:focus{outline:1px dashed #888}
.tx .tk{display:flex;align-items:flex-start;gap:.5em}
.tx .tk input{width:1.15em;height:1.15em;margin:.08em 0 0;flex:none;accent-color:#666}
.tx .ts{min-width:5cqw;outline:none}
.tx .ts:focus{outline:1px dashed #888}
.tx .dn .ts{text-decoration:line-through;opacity:.5}
#tb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 20px);padding:10px;background:rgba(36,36,38,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #3a3a3d;border-radius:26px;box-shadow:0 8px 30px rgba(0,0,0,.75)}
#tl,#op{display:flex;gap:6px;align-items:center;max-width:100%;overflow-x:auto;scrollbar-width:none}
#op{display:none;padding-top:8px;border-top:1px solid #3a3a3d;width:100%;justify-content:center}
#sw{display:flex;gap:6px;flex:none}
#tb button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:44px;padding:7px 5px 5px;border-radius:14px;background:#2c2c2e;color:#e8e8ea;font-size:10px;line-height:1}
#tb button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mm{display:none;position:absolute;bottom:calc(100% + 10px);right:0;flex-direction:column;gap:4px;min-width:220px;padding:8px;background:rgba(36,36,38,.97);border:1px solid #3a3a3d;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.75)}
#mm button{flex-direction:row;gap:12px;width:100%;justify-content:flex-start;padding:11px 12px;font-size:15px;background:transparent}
#mm button span{font-size:15px}
#tb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#tb input[type=color]{flex:none;width:40px;height:40px;padding:0;border:1px solid var(--bd);border-radius:10px;background:none}
#tb input[type=range]{flex:none;width:150px}
#tb i{flex:none;width:1px;height:28px;background:var(--bd)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#3a3a3c;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:20;max-width:90%}
.calp{display:flex;align-items:center;gap:10px;width:100%;position:relative;z-index:6;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--bd);text-align:left}
.calp b{flex:1;font-size:16px}
.cs{font-size:12px;padding:3px 9px;border-radius:99px}.cs.ok{background:#1f9d55;color:#fff}.cs.pd{background:#3a3a3d;color:#ddd}
.stk{font-size:13px;color:#ffb347}
.ov{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.5)}
.pop{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:7;max-height:75vh;overflow:auto;background:#1c1c1e;border:1px solid #3a3a3d;border-radius:22px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.85)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ch b{font-size:17px}.ch button{width:40px;height:40px;padding:0;border-radius:50%;font-size:20px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;touch-action:pan-y}
.wd{text-align:center;font-size:12px;color:var(--mu);padding:2px 0}
.dc{aspect-ratio:1;border:0;border-radius:12px;padding:0;font-size:15px;background:#2a2a2d;color:#fff}
.dc.done{background:#1f9d55}.dc.miss{background:#c93c3c}.dc.future,.dc.none{color:#77777b}.dc.tdy{outline:2px solid #fff;outline-offset:-2px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.sg div{background:#2a2a2d;border-radius:12px;padding:8px 4px;text-align:center}.sg b{display:block;font-size:18px}.sg span{font-size:11px;color:var(--mu)}
.lg{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--mu);margin-top:10px}
.rr{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #303033;font-size:14px}.rr b{flex:1}
.md{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.mc{background:#1c1c1e;border:1px solid #3a3a3d;border-radius:22px;padding:20px;width:100%;max-width:360px}
.sqr{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:6;max-width:460px;margin:0 auto}
.sq{aspect-ratio:1/1;background:#1c1c1e;border:1px solid #303033;border-radius:24px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.c1{align-items:center;justify-content:center;text-align:center;cursor:pointer}
.cw{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.bgd{font-size:clamp(44px,15vw,76px);font-weight:700;line-height:1}
.cm{font-size:13px;color:var(--mu);margin-top:2px}
.ctm{font-size:18px;font-weight:600;margin-top:8px}
.sqh{display:flex;align-items:center;gap:6px;margin-bottom:6px}.sqh b{flex:1;font-size:14px}
.cnt{font-size:12px;color:var(--mu)}
.sqb{border:0;background:#2a2a2d;border-radius:10px;width:28px;height:28px;padding:0;font-size:14px;flex:none}
.tl2{flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px}
.ti{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.25}
.ti input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:#1f9d55}
.ti span{flex:1;word-break:break-word}.ti.d span{text-decoration:line-through;color:var(--mu)}
.ti .x{padding:0 4px;font-size:14px}
.pop{max-width:460px;margin:0 auto}
.cldb{position:relative;width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.cldb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cldb::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#666;border:1.5px solid #1c1c1e}
.cldb[data-s=on]::after{background:#22c55e}.cldb[data-s=connecting]::after{background:#f59e0b}
.sy h3{margin:14px 0 6px;font-size:14px}.sy p{margin:0 0 8px;color:var(--mu);font-size:13px;line-height:1.4}
.sy input[type=text]{margin-bottom:8px;font-size:14px}.sy button.wide{width:100%;margin-bottom:6px}
.code{background:#2a2a2d;border-radius:12px;padding:10px;word-break:break-all;font-family:ui-monospace,monospace;font-size:13px;user-select:all;margin-bottom:8px}
</style>
<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="imp" accept="application/pdf,image/*" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<script>
var S={cats:[]},PG={},PGH={},TP={},ACT=null,OPEN=false,view=null,tool="pen",adding=false,delId=null,curP=null,db=null;
var COL={pen:"#111111",hl:"#ffe600",text:"#111111"},SZ={pen:4,hl:22,er:26,text:2.6};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m,ms){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none"},ms||2500)}
function idb(){return new Promise(function(r){try{var q=indexedDB.open("notes-v2",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv")};q.onsuccess=function(){db=q.result;r()};q.onerror=function(){r()}}catch(e){r()}})}
function put(k,v,ns){if(db){try{db.transaction("kv","readwrite").objectStore("kv").put(v,k)}catch(e){toast("Could not save")}}if(!ns&&k.slice(0,3)==="pg:")schedPg(k.slice(3))}
function rm(k){if(db){try{db.transaction("kv","readwrite").objectStore("kv").delete(k)}catch(e){}}if(SY&&k.slice(0,3)==="pg:"){var id=k.slice(3);clearTimeout(pgT[id]);rput("pg/"+id,null);rput("m/rev/"+id,null)}}
function get(k){return new Promise(function(r){if(!db)return r(null);try{var q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}}catch(e){r(null)}})}
function save(){put("meta",S);schedPush()}
function cat(){return S.cats.find(function(c){return c.id===view})}

var IC={
hand:'<path d="M18 11V6a2 2 0 0 0-4 0v-2a2 2 0 0 0-4 0v2a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/>',
pen:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
hl:'<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',
er:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>',
text:'<path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/>',
task:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/>',
more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
imp:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/>',
add:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6"/><path d="M9 15h6"/>',
undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>'};
function ic(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function tbtn(t,n,l){return '<button data-t="'+t+'">'+ic(n)+'<span>'+l+'</span></button>'}
function mbtn(id,n,l){return '<button id="'+id+'">'+ic(n)+'<span>'+l+'</span></button>'}
var TOOLS=tbtn("hand","hand","Scroll")+tbtn("pen","pen","Pen")+tbtn("hl","hl","Highlight")+tbtn("er","er","Eraser")+tbtn("text","text","Text")+tbtn("task","task","Checklist")+'<button id="bmore">'+ic("more")+'<span>More</span></button>';
var MENU=mbtn("bcam","cam","Take photo")+mbtn("bpdf","imp","Import PDF / image")+mbtn("badd","add","Add page")+mbtn("bun","undo","Undo")+mbtn("btp","grid","Paper style");
function render(){
  var a=document.getElementById("app"),h="";document.body.classList.remove("hand");
  if(!view){
    h+='<header><h1>Notes</h1><button class="cldb" id="cld" data-s="'+ST+'" onclick="openSync()" aria-label="Sync devices">'+ic("cloud")+'</button><button class="fab" onclick="adding=!adding;render()" aria-label="New category"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button></header>';
    h+='<div id="calw" style="position:relative;margin-bottom:12px"></div>';
    if(adding)h+='<div class="row"><input type="text" id="cn" placeholder="Category name (e.g. Coding)" onkeydown="if(event.key===\'Enter\')addCat()"><button onclick="addCat()">Create</button></div>';
    if(!S.cats.length&&!adding)h+='<div class="empty">No categories yet.<br>Tap + to create one.</div>';
    S.cats.forEach(function(c){
      if(delId===c.id)h+='<div class="card cat"><b>Delete "'+esc(c.name)+'"?</b><button onclick="doDel(\''+c.id+'\')" style="color:var(--dg)">Yes, delete</button><button onclick="delId=null;render()">No</button></div>';
      else h+='<div class="card cat" onclick="openCat(\''+c.id+'\')"><b>'+esc(c.name)+'</b><span>'+c.pages.length+' page'+(c.pages.length==1?'':'s')+'</span><button class="x" aria-label="Delete category" onclick="event.stopPropagation();delId=\''+c.id+'\';render()">🗑</button></div>';
    });
    a.innerHTML=h;var f=document.getElementById("cn");if(f)f.focus();drawCal();
  }else{
    var c=cat();
    a.innerHTML='<header id="edh"><button onclick="view=null;render()">←</button><h1 contenteditable="true" onblur="ren(this)">'+esc(c.name)+'</h1></header><div id="pages"></div>'+
    '<div id="tb"><div id="mm" onclick="this.style.display=\'none\'">'+MENU+'</div><div id="tl">'+TOOLS+'</div><div id="op"><span id="sw"></span><input type="color" id="tc"><input type="range" id="tr" min="1" max="60"></div></div>';
    c.pages.forEach(function(p,i){appendPage(p,i+1)});
    var T=document.getElementById("tb");
    T.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){var t=b.dataset.t;if(t===tool)OPEN=!OPEN;else OPEN=false;setTool(t)}});
    document.getElementById("bcam").onclick=function(){document.getElementById("cam").click()};
    document.getElementById("bpdf").onclick=function(){document.getElementById("imp").click()};
    document.getElementById("badd").onclick=function(){var e=addPage(null,1000,1400);e.scrollIntoView({behavior:"smooth"})};
    document.getElementById("bun").onclick=undo;
    document.getElementById("btp").onclick=cycleTpl;
    document.getElementById("bmore").onclick=function(){var m=document.getElementById("mm");m.style.display=m.style.display==="flex"?"none":"flex"};
    document.getElementById("tc").oninput=function(){var k=tool==="task"?"text":tool;if(COL[k])COL[k]=this.value;appT()};
    document.getElementById("tr").oninput=function(){var k=tool==="task"?"text":tool;if(SZ[k])SZ[k]=+this.value;appT()};
    OPEN=false;setTool(tool);
  }
}
function setTool(t){
  tool=t;document.body.classList.toggle("hand",t==="hand");
  document.querySelectorAll("#tb [data-t]").forEach(function(b){b.classList.toggle("on",b.dataset.t===tool)});
  t=t==="task"?"text":t;
  var tc=document.getElementById("tc"),tr=document.getElementById("tr");
  tc.style.display=COL[t]?"":"none";if(COL[t])tc.value=COL[t];
  var R={pen:[1,30,1],hl:[6,60,1],er:[6,80,1],text:[1.5,8,.1]}[t];if(R){tr.min=R[0];tr.max=R[1];tr.step=R[2]}
  if(t!=="text")ACT=null;
  tr.style.display=SZ[t]?"":"none";if(SZ[t])tr.value=SZ[t];document.getElementById("op").style.display=(OPEN&&(COL[t]||SZ[t]))?"flex":"none";
  var sw=document.getElementById("sw"),L=t==="hl"?["#ffe600","#7cfc00","#ff80c0","#40c4ff"]:(COL[t]?["#111111","#e53935","#1e66f5","#2e9e4f","#ff9800","#ffffff"]:[]);
  sw.innerHTML="";L.forEach(function(c){var b=document.createElement("button");b.style.cssText="min-width:0;width:30px;height:30px;padding:0;border-radius:50%;background:"+c+";border:2px solid #777;font-size:0";b.onclick=function(){COL[t]=c;tc.value=c;appT()};sw.appendChild(b)});
}
function ren(el){var v=el.innerText.trim();if(v){cat().name=v;save()}else el.textContent=cat().name}
function addCat(){var v=document.getElementById("cn").value.trim();if(!v)return;S.cats.push({id:uid(),name:v,pages:[]});adding=false;save();render()}
function doDel(id){var c=S.cats.find(function(x){return x.id===id});c.pages.forEach(function(p){rm("pg:"+p.id);delete PG[p.id];delete PGH[p.id]});S.cats=S.cats.filter(function(x){return x.id!==id});delId=null;save();render()}
function openCat(id){view=id;var c=cat();if(!c.pages.length){var p={id:uid(),w:1000,h:1400,texts:[]};PG[p.id]={bg:null,ink:null};put("pg:"+p.id,PG[p.id]);c.pages.push(p);save()}render()}
function delPage(id){var c=cat();c.pages=c.pages.filter(function(p){return p.id!==id});rm("pg:"+id);delete PG[id];delete PGH[id];save();render()}

function appendPage(p,n){
  var d=document.createElement("div");d.className="pw";
  d.innerHTML='<div class="ph2"><span>Page '+n+'</span><button class="x">🗑</button></div><div class="pg" style="aspect-ratio:'+p.w+'/'+p.h+'"></div>';
  document.getElementById("pages").appendChild(d);
  var pg=d.querySelector(".pg"),b=d.querySelector(".x");
  b.onclick=function(){if(b.dataset.s)delPage(p.id);else{b.dataset.s=1;b.textContent="Delete page?";setTimeout(function(){b.dataset.s="";b.textContent="🗑"},3000)}};
  new IntersectionObserver(function(es,o){if(es[0].isIntersecting){o.disconnect();initPage(p,pg)}},{rootMargin:"800px"}).observe(pg);
  return d;
}
function addPage(bg,w,h){
  var c=cat(),p={id:uid(),w:w,h:h,texts:[]};
  PG[p.id]={bg:bg,ink:null};put("pg:"+p.id,PG[p.id]);c.pages.push(p);save();
  return appendPage(p,c.pages.length);
}
function loadInk(ctx,u){var i=new Image();i.onload=function(){ctx.drawImage(i,0,0)};i.src=u}
var TPL=["blank","lined","grid","dots"];
function applyTpl(p,pg){
  var t=p.tpl||"blank",g=3.4,gx=(g*p.h/p.w).toFixed(2),s=pg.style,L="linear-gradient(#0000 calc(100% - 1px),#c8d3e6 0)",V="linear-gradient(90deg,#0000 calc(100% - 1px),#c8d3e6 0)";
  if(t==="lined"){s.backgroundImage=L;s.backgroundSize="100% "+g+"%"}
  else if(t==="grid"){s.backgroundImage=L+","+V;s.backgroundSize="100% "+g+"%,"+gx+"% "+g+"%"}
